; BambuHelper-Mono - Bambu Lab Printer Monitor
;
; ESP32-C3 SuperMini + SH1106 128x64 monochrome OLED over I2C.
; Plain `pio run` builds the default env (mono-c3); `pio run -e mono-c3` is
; equivalent.

; --- PlatformIO global settings ---
[platformio]
default_envs = mono-c3

; --- Applies to every environment ---
[env]
; Gzips web/app.css + web/app.js into a generated PROGMEM header before the
; build. Serving them compressed costs ~26 KB of flash instead of the ~106 KB
; the same code took inline in PAGE_HTML.
extra_scripts = pre:tools/gen_web_assets.py

; --- Shared library dependencies ---
[common]
; Improv WiFi Library is vendored in lib/ImprovWiFi (see its library.json) -
; the registry package pulls in arduino-libraries/WiFi via `depends=WiFi`,
; which shadows the ESP32 core WiFi library and breaks the build.
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

; --- No C++ exceptions: the 4 MB-flash env (1.75 MB app slots) ---
; ESP-IDF's own default; the Arduino core turns exceptions on. Dropping them from
; our TUs and libdeps removes the .eh_frame unwind tables and landing pads
; (~120-150 KB). -fexceptions must be unflagged: -fno-unwind-tables alone does
; nothing while it is on. Nothing in our code, the libdeps or the core libraries
; catches anything, so an unexpected throw (e.g. std::bad_alloc from operator new)
; ends in terminate() -> reboot exactly as before; allocations that may fail use
; new (std::nothrow). Soak-verified on C3 (dual TLS + live print + ~4000 HTTP
; requests) and esp32s3, 0 reboots.
[no_exceptions]
build_flags =
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
build_unflags =
    -fexceptions

; =============================================================================
;  BambuHelper-Mono: ESP32-C3 SuperMini + SH1106 128x64 over I2C
;  OLED pins live in build_flags (SDA=GPIO8, SCL=GPIO9).
; =============================================================================
[env:mono-c3]
platform = espressif32@6.12.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
lib_deps =
    ${common.lib_deps}
    ; NOTE: the PlatformIO registry keeps only the last 3 versions, so the
    ; reference repo's 1.10.9/2.1.10 are not available here (checked with
    ; `pio pkg show`). The oldest available ones are pinned; same SH1106G API
    ; (confirmed in both libraries' headers).
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit SH110X@2.1.13
build_flags =
    -D BOARD_VARIANT=\"mono_c3\"
    -D BOARD_NAME=\"ESP32-C3_SuperMini\"
    -D BOARD_PANEL=\"SH1106_128x64_I2C\"
    -D BOARD_IS_MONO=1
    -D ENABLE_OTA_AUTO=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_LOW_RAM=1
    ; No backlight: the SH1106 has none. -1 disables it in the display and
    ; button code.
    -D BACKLIGHT_PIN=-1
    ; --- OLED SH1106 over I2C ---
    -D OLED_SDA=8
    -D OLED_SCL=9
    -D OLED_I2C_ADDR=0x3c
    -D OLED_WIDTH=128
    -D OLED_HEIGHT=64
    -D OLED_RESET=-1
    ${no_exceptions.build_flags}
build_unflags = ${no_exceptions.build_unflags}
